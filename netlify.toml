[build]
  command = "npm run build"
  publish = "dist"
  # Only build when the Publish button (a Netlify build hook) asks, or when a commit
  # message contains [publish]. Other commits (e.g. CMS saves) are skipped, and
  # skipped builds cost no credits. Delete this line to build on every commit again.
  ignore = "bash scripts/should-build.sh"

[build.environment]
  NODE_VERSION = "24"

# The old Webflow blog overview lived at /blog.html.
[[redirects]]
  from = "/blog.html"
  to = "/blog/"
  status = 301

# The stories of the 2024/2025 voyage moved from /blog/<story>/ to /reis-24-25/<story>/.
# Not forced: a page that exists under /blog/ (new adventures) is served as usual; only
# addresses with no page there are sent on to the voyage.
[[redirects]]
  from = "/blog/*"
  to = "/reis-24-25/:splat"
  status = 301

# Unknown URLs: Netlify serves dist/404.html automatically (from src/pages/404.astro).
