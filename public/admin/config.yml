# Sveltia CMS configuration — https://github.com/sveltia/sveltia-cms
# Every change you save here becomes a commit in GitHub. It goes live when you
# press Publish at /admin/publish/ (see README.md).

backend:
  name: github
  repo: rorikkk/sailingluwte
  branch: master
  # For "Sign in with GitHub", deploy the free auth worker
  # (https://github.com/sveltia/sveltia-cms-auth) and paste its URL here.
  # Without it you can still sign in with a GitHub personal access token.
  # base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev
  commit_messages:
    create: "{{collection}} “{{slug}}” toegevoegd"
    update: "{{collection}} “{{slug}}” bijgewerkt"
    delete: "{{collection}} “{{slug}}” verwijderd"
    uploadMedia: "“{{path}}” geüpload"
    deleteMedia: "“{{path}}” verwijderd"

site_url: https://luwte.amsterdam
display_url: https://luwte.amsterdam
logo_url: /images/favicon.jpg

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ───────────── Blog ─────────────
  - name: posts
    label: Blog
    label_singular: Blogpost
    description: Nieuwe avonturen op /blog/.
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}/"
    sortable_fields: [date, title]
    view_filters:
      - { label: Concepten, field: draft, pattern: true }
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Datum, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: Samenvatting, name: excerpt, widget: text, required: false, hint: "Korte tekst op de kaartjes in de bloglijst (maximaal 40 woorden). Leeg = automatisch de eerste 40 woorden van de tekst." }
      - { label: Omslagfoto, name: cover, widget: image, required: false, hint: "Foto op de kaartjes in de bloglijst. Leeg = automatisch de eerste foto uit het verhaal." }
      - { label: Beschrijving omslagfoto, name: coverAlt, widget: string, required: false, hint: "Wat staat er op de foto? (voor schermlezers)" }
      - { label: Concept (nog niet op de site), name: draft, widget: boolean, default: false }
      - { label: Tekst, name: body, widget: markdown, hint: "Bij een foto wordt de titel van de afbeelding het onderschrift." }

  # ───────────── Reis '24/'25 (afgesloten) ─────────────
  - name: trip
    label: "Reis '24/'25"
    label_singular: Reisverhaal
    description: "Verhalen van de reis 2024–2025 op /reis-24-25/ (afgesloten reis)."
    folder: src/content/reis-24-25
    create: true
    slug: "{{slug}}"
    preview_path: "reis-24-25/{{slug}}/"
    sortable_fields: [date, title]
    view_filters:
      - { label: Concepten, field: draft, pattern: true }
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Datum, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: Samenvatting, name: excerpt, widget: text, required: false, hint: "Korte tekst op de kaartjes in de bloglijst (maximaal 40 woorden). Leeg = automatisch de eerste 40 woorden van de tekst." }
      - { label: Omslagfoto, name: cover, widget: image, required: false, hint: "Foto op de kaartjes in de bloglijst. Leeg = automatisch de eerste foto uit het verhaal." }
      - { label: Beschrijving omslagfoto, name: coverAlt, widget: string, required: false, hint: "Wat staat er op de foto? (voor schermlezers)" }
      - { label: Concept (nog niet op de site), name: draft, widget: boolean, default: false }
      - { label: Tekst, name: body, widget: markdown, hint: "Bij een foto wordt de titel van de afbeelding het onderschrift." }

  # ───────────── Vaste pagina's ─────────────
  - name: pages
    label: Pagina's
    description: "Home, Over ons, Blog-pagina, Reis '24/'25, Contact, Bedankt, bestemmingen en menu/footer."
    files:
      - name: home
        label: Home
        file: src/data/home.json
        fields:
          - { label: Grote titel, name: heroHeading, widget: text, hint: "Enter = nieuwe regel." }
          - { label: Ondertitel, name: heroSubtitle, widget: text, hint: "Enter = nieuwe regel." }
          - { label: Knoptekst onder de titel, name: heroCta, widget: string }
          - { label: Kop boven de schip-gegevens, name: shipSpecsHeading, widget: string }
          - label: Schip-gegevens
            name: shipSpecs
            widget: list
            min: 5
            max: 5
            allow_add: false
            hint: "Precies 5 blokken: de pagina heeft 5 vakjes. Pas de tekst aan, maar voeg er geen toe of weg."
            summary: "{{title}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Tekst, name: body, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
          - { label: Kop bemanning, name: crewHeading, widget: string }
          - { label: Tekst bemanning, name: crewSubtitle, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
          - label: Bemanningsleden
            name: crewMembers
            widget: list
            min: 1
            max: 1
            allow_add: false
            hint: "Precies 1: de pagina heeft 1 vakje voor de bemanning, met daarnaast het meezeil-vakje."
            summary: "{{name}} — {{role}}"
            fields:
              - { label: Naam, name: name, widget: string }
              - { label: Rol, name: role, widget: string }
          - label: Meezeilen (vakje naast de bemanning)
            name: joinCrew
            widget: object
            hint: "Aanmeldingen komen binnen in Netlify onder Forms › meezeilen."
            fields:
              - { label: Naam onder het vakje, name: name, widget: string }
              - { label: Rol onder het vakje, name: role, widget: string }
              - { label: Tekst boven het formulier, name: intro, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
              - { label: Voorbeeldtekst in het berichtveld, name: messagePlaceholder, widget: string }
              - { label: Knoptekst, name: buttonText, widget: string }
              - { label: Melding na versturen, name: successText, widget: string }
              - { label: Melding als versturen mislukt, name: errorText, widget: string }
          - { label: Kop donatieblok, name: donationHeading, widget: string }
          - { label: Tekst donatieblok, name: donationText, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
          - label: Lijstje donatieblok
            name: donationChecklist
            widget: list
            min: 3
            max: 3
            allow_add: false
            hint: "Precies 3 regels: de pagina heeft 3 vinkjes."
            field: { label: Regel, name: item, widget: string }
          - { label: Kop positie, name: positionHeading, widget: string }
          - { label: Tekst positie, name: positionText, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
          - { label: Kop bestemmingen, name: destinationsHeading, widget: string }
          - { label: Ondertitel bestemmingen, name: destinationsSubtitle, widget: string, hint: "De bestemmingen zelf staan onder Pagina's › Bestemmingen." }

      - name: about
        label: Over ons
        file: src/data/about.json
        fields:
          - { label: Grote titel, name: heroHeading, widget: string }
          - { label: Ondertitel, name: heroSubtitle, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
          - { label: Knoptekst onder de titel, name: heroCta, widget: string }
          - label: Profielen
            name: profiles
            widget: list
            min: 1
            max: 1
            allow_add: false
            hint: "Precies 1 profiel met 4 vakjes: zo is de pagina opgebouwd."
            summary: "{{name}}"
            fields:
              - { label: Naam, name: name, widget: string }
              - { label: Over mij, name: bio, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
              - label: Vakjes
                name: tiles
                widget: list
                min: 4
                max: 4
                allow_add: false
                hint: "Precies 4 vakjes."
                summary: "{{title}}"
                fields:
                  - { label: Titel, name: title, widget: string }
                  - { label: Tekst, name: body, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }

      - name: blog
        label: Blog-pagina
        description: "De pagina /blog/ (nieuwe avonturen). De knoppen en koppen onder een blogpost gelden voor beide blogs."
        file: src/data/blog.json
        fields:
          - { label: Grote titel, name: heroHeading, widget: string }
          - { label: Ondertitel, name: heroSubtitle, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
          - { label: Tekst zolang er nog geen verhalen zijn, name: emptyText, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
          - { label: Knoptekst naar de reis '24/'25 (zolang er nog geen verhalen zijn), name: emptyLinkText, widget: string }
          - { label: Knoptekst nieuwsbrief, name: newsletterButtonText, widget: string }
          - { label: Kop nieuwsbrief (onder een blogpost), name: newsletterLabel, widget: string }
          - { label: Kop “meer verhalen” (onder een blogpost), name: moreStoriesHeading, widget: string }

      - name: reis
        label: "Reis '24/'25"
        file: src/data/reis.json
        description: "Overzichtspagina /reis-24-25/ en de bloglijst /reis-24-25/blog/."
        fields:
          - { label: Titel (tabblad), name: title, widget: string }
          - { label: Grote titel, name: heroHeading, widget: string }
          - { label: Introductie, name: heroSubtitle, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
          - label: Tegels
            name: tiles
            widget: list
            summary: "{{title}} — {{url}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Tekst, name: text, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
              - { label: Knoptekst, name: buttonText, widget: string }
              - { label: Link, name: url, widget: string, hint: "Bijv. /reis-24-25/blog/ of https://…" }
          - label: Bloglijst van de reis (/reis-24-25/blog/)
            name: blogPage
            widget: object
            fields:
              - { label: Titel (tabblad), name: title, widget: string }
              - { label: Grote titel, name: heroHeading, widget: string }
              - { label: Ondertitel, name: heroSubtitle, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }

      - name: contact
        label: Contact
        file: src/data/contact.json
        fields:
          - { label: Titel, name: heading, widget: string }
          - { label: Introductie, name: intro, widget: string }
          - label: Gegevens
            name: details
            widget: list
            min: 4
            max: 4
            allow_add: false
            hint: "Precies 4 blokken: de pagina heeft 4 vakjes."
            summary: "{{label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Tekst, name: text, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
          - { label: E-mailadres, name: email, widget: string }

      - name: bedankt
        label: Bedankt (na donatie)
        file: src/data/bedankt.json
        fields:
          - { label: Grote titel, name: heroHeading, widget: string }
          - { label: Ondertitel, name: heroSubtitle, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
          - { label: Knoptekst onder de titel, name: heroCta, widget: string }
          - label: Portemonnees
            name: wallets
            widget: list
            min: 1
            max: 1
            allow_add: false
            hint: "Precies 1 portemonnee met 4 vakjes: zo is de pagina opgebouwd."
            summary: "{{name}}"
            fields:
              - { label: Naam, name: name, widget: string }
              - { label: Ondertitel, name: subtitle, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }
              - label: Vakjes
                name: tiles
                widget: list
                min: 4
                max: 4
                allow_add: false
                hint: "Precies 4 vakjes."
                summary: "{{title}}"
                fields:
                  - { label: Titel, name: title, widget: string }
                  - { label: Tekst, name: body, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }

      - name: destinations
        label: Bestemmingen
        file: src/data/destinations.json
        fields:
          - label: Bestemmingen
            name: items
            widget: list
            hint: "Op de homepage, in deze volgorde. Nieuwe bestemming? Voeg hem onderaan toe."
            summary: "{{date}} · {{name}}"
            fields:
              - { label: Plaats, name: name, widget: string, hint: "Bijv. Cedeira - ES" }
              - { label: Datum, name: date, widget: string, hint: "Vrije tekst, bijv. 30-07-2024" }
              - { label: Al bezocht, name: visited, widget: boolean, default: true }
              - { label: Verhaal, name: description, widget: text, hint: "Enter = nieuwe regel. **vet**, *schuin* en [link](https://…) werken." }

      - name: site
        label: Menu en footer
        file: src/data/site.json
        fields:
          - label: Menu
            name: navLinks
            widget: list
            summary: "{{label}} — {{url}}"
            fields:
              - { label: Tekst, name: label, widget: string }
              - { label: Link, name: url, widget: string, hint: "Bijv. /about.html of https://…" }
              - { label: Opent in nieuw tabblad, name: external, widget: boolean, default: false }
              - label: Dropdown-items
                name: children
                widget: list
                required: false
                hint: "Optioneel. Met items wordt dit menu-item een dropdown."
                summary: "{{label}} — {{url}}"
                fields:
                  - { label: Tekst, name: label, widget: string }
                  - { label: Link, name: url, widget: string }
                  - { label: Opent in nieuw tabblad, name: external, widget: boolean, default: false }
          - { label: Naam in de footer, name: footerBrand, widget: string }
          - label: Footer-links
            name: footerLinks
            widget: list
            summary: "{{label}} — {{url}}"
            fields:
              - { label: Tekst, name: label, widget: string }
              - { label: Link, name: url, widget: string }
          - { label: Copyright-regel, name: footerCopyright, widget: string }
